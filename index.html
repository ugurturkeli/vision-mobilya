<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şikayet Otomasyonu</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        form { max-width: 400px; display: flex; flex-direction: column; }
        label { margin-top: 10px; }
        input, textarea { padding: 8px; margin-top: 5px; }
        button { margin-top: 15px; padding: 10px; background-color: #007bff; color: #fff; border: none; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        #status { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Şikayet Otomasyonu</h1>
    <form id="complaintForm">
        <label for="name">Adınız:</label>
        <input type="text" id="name" required>

        <label for="email">E-posta:</label>
        <input type="email" id="email" required>

        <label for="complaint">Şikayetiniz:</label>
        <textarea id="complaint" rows="4" required></textarea>

        <button type="submit">Gönder</button>
    </form>
    <div id="status"></div>

    <script>
        const form = document.getElementById('complaintForm');
        const status = document.getElementById('status');

        form.addEventListener('submit', function(event) {
            event.preventDefault();

            const data = {
                name: document.getElementById('name').value.trim(),
                email: document.getElementById('email').value.trim(),
                complaint: document.getElementById('complaint').value.trim(),
                date: new Date().toISOString()
            };

            const complaints = JSON.parse(localStorage.getItem('complaints') || '[]');
            complaints.push(data);
            localStorage.setItem('complaints', JSON.stringify(complaints));

            form.reset();
            status.textContent = 'Şikayetiniz başarıyla kaydedildi!';
        });
    </script>
</body>
</html>
